[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pydantic>=2"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
doctools = "doctools.adapters.cli:main"

[tool.setuptools.packages.find]
include = ["doctools*"]
